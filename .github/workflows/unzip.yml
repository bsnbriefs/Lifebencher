name: Extract Source Files

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract project files
        run: |
          if [ -f "lifebencher-match.zip" ]; then
            ZIP_FILE="lifebencher-match.zip"
          elif [ -f ".github/workflows/lifebencher-match.zip" ]; then
            ZIP_FILE=".github/workflows/lifebencher-match.zip"
          else
            echo "ZIP file not found"
            exit 1
          fi

          echo "Using $ZIP_FILE"

          rm -rf /tmp/lifebencher-extract
          mkdir -p /tmp/lifebencher-extract

          unzip -o "$ZIP_FILE" -d /tmp/lifebencher-extract

          if [ -d "/tmp/lifebencher-extract/lifebencher" ]; then
            cp -a /tmp/lifebencher-extract/lifebencher/. .
          else
            cp -a /tmp/lifebencher-extract/. .
          fi

          rm -f "$ZIP_FILE"

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          git reset -- .github/workflows/unzip.yml

          git commit -m "feat: update Lifebencher source files" || echo "No changes to commit"

          git push
