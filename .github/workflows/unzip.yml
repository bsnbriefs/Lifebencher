name: Extract Source Files
on:
  push:
    paths:
      - 'lifebencher-match.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip and commit folders
        run: |
         unzip -o lifebencher-match.zip
         rm lifebencher-match.zip
         git config user.name "github-actions[bot]"
         git config user.email "github-actions[bot]@users.noreply.github.com"
         git add src public
         git commit -m "feat: populate src and public folders"
         git push
