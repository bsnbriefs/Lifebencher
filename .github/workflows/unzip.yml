name: Extract Source Files
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip and commit folders
        run: |
          # Find the zip file whether in root or inside .github/workflows
          if [ -f "lifebencher-match.zip" ]; then
            ZIP_FILE="lifebencher-match.zip"
          elif [ -f ".github/workflows/lifebencher-match.zip" ]; then
            ZIP_FILE=".github/workflows/lifebencher-match.zip"
          fi

          echo "Unpacking $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d .
          rm -f "$ZIP_FILE"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src public
          git commit -m "feat: populate src and public folders" || echo "No changes to commit"
          git push
